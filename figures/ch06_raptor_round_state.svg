<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 525" role="img"><title>이전 라운드 값으로 승차하고 현재 라운드에 도착시각 기록하기</title><style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#20344d;font-size:18px}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.small{font-size:16px;fill:#52677e}.mono{font-family:ui-monospace,monospace;font-size:17px}.blue{fill:#2869a4}.orange{fill:#ad6911}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607c96"/></marker></defs><rect width="960" height="525" fill="white"/><text x="25" y="35" class="title" text-anchor="start">이번에 도착한 D에서 타는 계산은 다음 라운드에서 합니다</text><rect x="20" y="63" width="280" height="395" rx="10" fill="#fff" stroke="#c6d4e0"/><text x="36" y="98" class="head" text-anchor="start">라운드 0 · 접근</text><rect x="340" y="63" width="280" height="395" rx="10" fill="#fff" stroke="#c6d4e0"/><text x="356" y="98" class="head" text-anchor="start">라운드 1 · 첫 탑승</text><rect x="660" y="63" width="280" height="395" rx="10" fill="#fff" stroke="#c6d4e0"/><text x="676" y="98" class="head" text-anchor="start">라운드 2 · 두 번째 탑승</text><rect x="36" y="131" width="248" height="123" rx="10" fill="#eef5fd" stroke="#c6d4e0"/><text x="53" y="161" class="head" text-anchor="start">출발지의 준비 시각</text><text x="53" y="198" class="mono" text-anchor="start">A  08:00</text><text x="53" y="231" class="mono" text-anchor="start">D  미도달</text><text x="37" y="298" class="small" text-anchor="start">아직 어떤 운행에도</text><text x="37" y="324" class="small" text-anchor="start">탑승하지 않았습니다.</text><rect x="356" y="131" width="248" height="123" rx="10" fill="#eef5fd" stroke="#c6d4e0"/><text x="373" y="160" class="head" text-anchor="start">승차 판단: prev</text><text x="373" y="194" class="small" text-anchor="start">A 08:00 → 첫 차 탑승</text><text x="373" y="224" class="small" text-anchor="start">D는 아직 미도달</text><rect x="356" y="279" width="248" height="158" rx="10" fill="#fff5e6" stroke="#c6d4e0"/><text x="373" y="311" class="head" text-anchor="start">이번 결과: cur</text><text x="373" y="344" class="mono" text-anchor="start">B 08:10 · C 08:20</text><text x="373" y="376" class="small" text-anchor="start">B에서 110초 도보</text><text x="373" y="411" class="mono" text-anchor="start">D 08:11:50</text><rect x="676" y="131" width="248" height="123" rx="10" fill="#eef5fd" stroke="#c6d4e0"/><text x="693" y="160" class="head" text-anchor="start">승차 판단: prev</text><text x="693" y="194" class="mono" text-anchor="start">D 08:11:50 ≤ 08:15</text><text x="693" y="224" class="small" text-anchor="start">2호선에 탈 수 있습니다.</text><rect x="676" y="279" width="248" height="158" rx="10" fill="#fff5e6" stroke="#c6d4e0"/><text x="693" y="311" class="head" text-anchor="start">이번 결과: cur</text><text x="693" y="349" class="mono" text-anchor="start">E 08:25</text><text x="693" y="384" class="small" text-anchor="start">이전 도착시각도 유지</text><text x="693" y="414" class="small" text-anchor="start">총 2번 탑승 · 환승 1회</text><path d="M284 190H356" fill="none" stroke="#607c96" stroke-width="2" marker-end="url(#arrow)"/><path d="M604 406H640V193H676" fill="none" stroke="#607c96" stroke-width="2" marker-end="url(#arrow)"/><text x="480" y="494" class="head" text-anchor="middle">라운드를 마칠 때 cur가 다음 라운드의 prev가 됩니다.</text></svg>