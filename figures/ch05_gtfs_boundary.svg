<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" role="img"><title>정류장으로 선택하고 노선 전체를 보존하기</title><style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#20344d;font-size:18px}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.small{font-size:16px;fill:#52677e}.mono{font-family:ui-monospace,monospace;font-size:17px}.blue{fill:#2869a4}.orange{fill:#ad6911}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607c96"/></marker></defs><rect width="960" height="445" fill="white"/><text x="25" y="35" class="title" text-anchor="start">경계는 노선을 고르는 조건입니다</text><rect x="20" y="57" width="445" height="304" rx="10" fill="#fff" stroke="#c6d4e0"/><text x="38" y="89" class="head" text-anchor="start">정류장만 남기면</text><rect x="46" y="190" width="388" height="114" rx="0" fill="#edf6f3" stroke="#84b5a4"/><text x="58" y="293" class="small" text-anchor="start">선택 영역 안</text><circle cx="92" cy="242" r="19" fill="white" stroke="#2869a4" stroke-width="2"/><text x="92" y="248" class="head" text-anchor="middle">A</text><circle cx="242" cy="145" r="19" fill="white" stroke="#b0b8c1" stroke-width="2" stroke-dasharray="4 3"/><text x="242" y="151" class="head" text-anchor="middle">B</text><circle cx="386" cy="242" r="19" fill="white" stroke="#2869a4" stroke-width="2"/><text x="386" y="248" class="head" text-anchor="middle">C</text><text x="265" y="148" class="small" text-anchor="start">영역 밖</text><text x="38" y="338" class="small" text-anchor="start">A와 C만 남아 B에서의 환승 정보를 잃습니다.</text><rect x="495" y="57" width="445" height="304" rx="10" fill="#fff" stroke="#c6d4e0"/><text x="513" y="89" class="head" text-anchor="start">노선 전체를 남기면</text><rect x="521" y="190" width="388" height="114" rx="0" fill="#edf6f3" stroke="#84b5a4"/><text x="533" y="293" class="small" text-anchor="start">선택 영역 안</text><path d="M567 242L717 145L861 242" fill="none" stroke="#2869a4" stroke-width="4"/><circle cx="567" cy="242" r="19" fill="white" stroke="#2869a4" stroke-width="2"/><text x="567" y="248" class="head" text-anchor="middle">A</text><circle cx="717" cy="145" r="19" fill="white" stroke="#2869a4" stroke-width="2"/><text x="717" y="151" class="head" text-anchor="middle">B</text><circle cx="861" cy="242" r="19" fill="white" stroke="#2869a4" stroke-width="2"/><text x="861" y="248" class="head" text-anchor="middle">C</text><text x="740" y="148" class="small" text-anchor="start">영역 밖</text><text x="513" y="338" class="small" text-anchor="start">A를 지나는 노선을 골라 B의 기록도 남깁니다.</text><text x="25" y="398" class="head" text-anchor="start">영역 안 정류장</text><path d="M172 392H205" fill="none" stroke="#607c96" stroke-width="2" marker-end="url(#arrow)"/><text x="219" y="398" class="head" text-anchor="start">그곳을 지나는 운행</text><path d="M395 392H428" fill="none" stroke="#607c96" stroke-width="2" marker-end="url(#arrow)"/><text x="442" y="398" class="head" text-anchor="start">운행이 속한 노선</text><path d="M610 392H643" fill="none" stroke="#607c96" stroke-width="2" marker-end="url(#arrow)"/><text x="658" y="398" class="head" text-anchor="start">그 노선의 모든 운행</text><text x="25" y="432" class="small" text-anchor="start">가상 경계와 A→B→C 노선입니다. 보존된 노선끼리만 계산하면 외부의 다른 환승 노선은 빠질 수 있습니다.</text></svg>