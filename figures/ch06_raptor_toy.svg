<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" role="img"><title>RAPTOR 작은 시간표</title><style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#20344d;font-size:17px}.title{font-size:24px;font-weight:700}.small{font-size:15px;fill:#53687f}.label{font-weight:700}.box{fill:#f1f6fb;stroke:#a9bed3;stroke-width:1.5}.arrow{fill:none;stroke:#53799e;stroke-width:2;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#53799e"/></marker></defs><rect width="940" height="420" fill="white"/><text x="25" y="36" class="title">08:00에 A에서 출발하면 E에 08:25 도착합니다</text><path d="M110 130H780" stroke="#2869a4" stroke-width="7"/><path d="M430 290H780" stroke="#1a8274" stroke-width="7"/><path d="M430 148V272" stroke="#af7421" stroke-width="3" stroke-dasharray="7 6"/><circle cx="110" cy="130" r="21" fill="white" stroke="#20344d" stroke-width="2"/><text x="104" y="136" class="label">A</text><text x="75" y="93" class="">08:00</text><circle cx="430" cy="130" r="21" fill="white" stroke="#20344d" stroke-width="2"/><text x="424" y="136" class="label">B</text><text x="395" y="93" class="">08:10</text><circle cx="780" cy="130" r="21" fill="white" stroke="#20344d" stroke-width="2"/><text x="774" y="136" class="label">C</text><text x="745" y="93" class="">08:20</text><circle cx="430" cy="290" r="21" fill="white" stroke="#20344d" stroke-width="2"/><text x="424" y="296" class="label">D</text><text x="460" y="253" class="">08:15 출발</text><circle cx="780" cy="290" r="21" fill="white" stroke="#20344d" stroke-width="2"/><text x="774" y="296" class="label">E</text><text x="745" y="253" class="">08:25</text><text x="150" y="178" class="small">1호선 두 번째 차: 08:30 → 08:40 → 08:50</text><text x="450" y="215" class="small">도보 110초 · D에 08:11:50 도착</text><text x="450" y="320" class="small">2호선은 08:15 출발편 한 대</text><text x="25" y="389" class="small">A에