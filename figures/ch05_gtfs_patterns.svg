<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 425" role="img"><title>하나의 노선에서 정류장 순서별로 패턴 만들기</title><style>text{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#20344d;font-size:18px}.title{font-size:25px;font-weight:700}.head{font-size:20px;font-weight:700}.small{font-size:16px;fill:#52677e}.mono{font-family:ui-monospace,monospace;font-size:17px}.blue{fill:#2869a4}.orange{fill:#ad6911}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607c96"/></marker></defs><rect width="960" height="425" fill="white"/><text x="25" y="35" class="title" text-anchor="start">같은 노선의 운행도 정류장 순서가 다를 수 있습니다</text><text x="30" y="80" class="head" text-anchor="start">노선 R의 운행 4개</text><text x="550" y="80" class="head" text-anchor="start">정류장 순서로 묶은 패턴 3개</text><rect x="25" y="95" width="340" height="53" rx="10" fill="#f2f6fa" stroke="#c6d4e0"/><text x="43" y="127" class="" text-anchor="start">T1 · 08:00 출발</text><text x="240" y="127" class="small" text-anchor="start">A → B → C</text><rect x="25" y="162" width="340" height="53" rx="10" fill="#f2f6fa" stroke="#c6d4e0"/><text x="43" y="194" class="" text-anchor="start">T2 · 08:30 출발</text><text x="240" y="194" class="small" text-anchor="start">A → B → C</text><rect x="25" y="229" width="340" height="53" rx="10" fill="#f2f6fa" stroke="#c6d4e0"/><text x="43" y="261" class="" text-anchor="start">T3 · 08:10 출발</text><text x="240" y="261" class="small" text-anchor="start">C → B → A</text><rect x="25" y="296" width="340" height="53" rx="10" fill="#f2f6fa" stroke="#c6d4e0"/><text x="43" y="328" class="" text-anchor="start">T4 · 08:20 출발</text><text x="240" y="328" class="small" text-anchor="start">A → B</text><rect x="545" y="97" width="387" height="106" rx="10" fill="#eef5fd" stroke="#c6d4e0"/><text x="562" y="129" class="head" text-anchor="start">패턴 1 · A → B → C</text><text x="562" y="157" class="small" text-anchor="start">T1의 08:00편과 T2의 08:30편을</text><text x="562" y="183" class="small" text-anchor="start">각각의 시간표로 보관합니다.</text><rect x="545" y="229" width="387" height="64" rx="10" fill="#edf6f3" stroke="#c6d4e0"/><text x="562" y="255" class="head" text-anchor="start">패턴 2 · C → B → A</text><text x="562" y="279" class="small" text-anchor="start">T3 · 08:10편</text><rect x="545" y="313" width="387" height="64" rx="10" fill="#fff5e6" stroke="#c6d4e0"/><text x="562" y="339" class="head" text-anchor="start">패턴 3 · A → B</text><text x="562" y="363" class="small" text-anchor="start">T4 · 08:20편</text><path d="M365 122H430V139H545" fill="none" stroke="#607c96" stroke-width="2" marker-end="url(#arrow)"/><path d="M365 189H452V172H545" fill="none" stroke="#607c96" stroke-width="2" marker-end="url(#arrow)"/><path d="M365 256H545" fill="none" stroke="#607c96" stroke-width="2" marker-end="url(#arrow)"/><path d="M365 323H430V345H545" fill="none" stroke="#607c96" stroke-width="2" marker-end="url(#arrow)"/><text x="25" y="411" class="small" text-anchor="start">묶는 기준은 (route_id, 정류장 순서)입니다. 출발시각이 달라도 순서가 같으면 같은 패턴입니다.</text></svg>